name: CI

# The JS half of the gate. Rust lives in rust.yml: the two share a repo but not
# a toolchain, and neither should wait on the other.

permissions:
  contents: read

on:
  push:
    branches: [master]
    paths-ignore: ['docs/**', '**/*.md']
  # No branch filter, so stacked PRs (based on another feature branch) are
  # checked too.
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Skip installing git hooks on CI.
  HUSKY: 0

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm lint
      # Ubuntu only: Windows checks files out with CRLF, which Prettier
      # (endOfLine lf) would flag on every file.
      - run: pnpm format:check

  web:
    name: Typecheck, test, build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm test
      - name: Web build
        run: pnpm build

  landing:
    name: Landing build, budget and a11y
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm --filter @kireimanga/landing check
      - run: pnpm build:landing
      # Fails when the first view, the 3D island JS or its models grow past
      # the budget in apps/landing/scripts/check-budget.mjs.
      - run: pnpm --filter @kireimanga/landing check:budget
      - run: pnpm --filter @kireimanga/landing exec playwright install --with-deps chromium
      # axe WCAG 2.1 AA at desktop and phone widths, no sideways scroll, the
      # 16px gutter, the page with JavaScript off and with reduced motion.
      - run: pnpm --filter @kireimanga/landing check:page
