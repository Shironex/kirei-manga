name: Rust

permissions:
  contents: read

on:
  push:
    branches: [master, rewrite/tauri]
    paths-ignore: ['docs/**', '**/*.md']
  # No branch filter, so stacked PRs (based on another feature branch) are
  # checked too.
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Installs exactly the toolchain pinned in rust-toolchain.toml.
      - name: Install pinned Rust toolchain
        run: rustup show
      - run: cargo fmt --all --check

  rust:
    # Windows and macOS are the shipping targets, so clippy and the tests run
    # on both: compiling for a platform is not the same as behaving on it.
    name: Clippy and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # The workspace manifest holds the build profiles: a profile change
          # rebuilds every crate, so it must save a fresh cache too.
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # `-- -D warnings` denies in the workspace crates only, never in
      # dependencies, unlike RUSTFLAGS.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  deny:
    # Licence and advisory policy from deny.toml. A new dependency with a
    # licence outside the allow list, or a known advisory, fails here.
    name: Licences and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
