[package]
name = "kirei-desktop"
description = "KireiManga desktop shell (Tauri 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "kirei-desktop"

[lib]
name = "kirei_desktop_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
kirei-anilist = { workspace = true }
keyring = { workspace = true }
kirei-archive = { workspace = true }
kirei-core = { workspace = true }
kirei-download = { workspace = true }
kirei-library = { workspace = true }
kirei-mangadex = { workspace = true }
kirei-reader = { workspace = true }
lru = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-window-state = { workspace = true }
# The tracking worker: blocking database calls, its wake up select and timer.
# Tauri runs on tokio already.
tokio = { workspace = true, features = ["rt", "macros"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock = { workspace = true }
zip = { workspace = true }

[lints]
workspace = true
