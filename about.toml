# cargo-about config: which licences the generated THIRD_PARTY_NOTICES may
# list. Keep in step with the allow list in deny.toml (deny.toml is the gate,
# this file only feeds the generator). Regenerate with `pnpm notices`.
accepted = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
]
# The shipping targets only; Linux-only crates never reach a release bundle.
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
# Build and dev dependencies are not part of the shipped binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Our own crates (publish = false) carry the repo LICENSE, not an SPDX id.
private = { ignore = true }
