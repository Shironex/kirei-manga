# KireiManga Rust workspace.
#
# The domain crates under `crates/` own the backend logic and
# `apps/desktop/src-tauri` is a thin composition root that wires them into the
# Tauri 2 shell. Dependencies point one way only: core -> archive -> reader ->
# src-tauri. A crate never depends on one that sits above it.

[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["Shironex"]
license-file = "LICENSE"
repository = "https://github.com/Shironex/kirei-manga"
publish = false

[workspace.dependencies]
# Internal crates.
kirei-core = { path = "crates/kirei-core" }
kirei-archive = { path = "crates/kirei-archive" }
kirei-reader = { path = "crates/kirei-reader" }

# External. Versions live here, never in a leaf crate, so the tree stays unified.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Desktop shell. Reached from apps/desktop/src-tauri only.
tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.7", features = [] }

# Archive backends (kirei-archive). Reading only: `deflate-flate2-zlib-rs` is
# the one decoder CBZ files use in practice, and it skips the zopfli encoder
# the plain `deflate` feature pulls in. Locked to 9.1.3 in Cargo.lock because
# the 9.x line shipped twelve releases in two weeks; move up once one has aged.
zip = { version = "9.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# RAR (CBR) reading. Wraps RARLAB's UnRAR C++ source, the reference decoder:
# every RAR version, solid archives, and the same code WinRAR extracts with.
# The Rust crate is MIT OR Apache-2.0; the vendored UnRAR source is under the
# UnRAR licence (free to use in any software that handles RAR archives, may not
# be used to build a RAR compressor). Builds with the platform C++ toolchain.
unrar = "0.5.8"
# Pixel size from image headers, without decoding.
imagesize = "0.15"
# The page cache's recency order (kirei-reader). MIT.
lru = "0.19"

# Test-only helpers.
tempfile = "3"
crc32fast = "1.5"
# Writes RAR fixtures inside the tests, since no RAR encoder ships with the
# OS or CI runners. Pure Rust, Apache-2.0, dev-dependency only.
rars = "=0.12.3"

# Lints are declared once and inherited by every member via `[lints] workspace
# = true`. CI runs clippy with `-D warnings`, so a warn here is a hard gate.
[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
await_holding_lock = "warn"
# `.unwrap()` in a desktop app is a user-visible crash; propagate instead.
unwrap_used = "warn"
todo = "warn"
dbg_macro = "warn"

[profile.dev]
incremental = true

[profile.release]
lto = true
codegen-units = 1
strip = true
