# KireiManga Rust workspace.
#
# The domain crates under `crates/` own the backend logic and
# `apps/desktop/src-tauri` is a thin composition root that wires them into the
# Tauri 2 shell. Dependencies point one way only: core -> archive -> reader ->
# src-tauri. A crate never depends on one that sits above it.

[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["Shironex"]
license-file = "LICENSE"
repository = "https://github.com/Shironex/kirei-manga"
publish = false

[workspace.dependencies]
# Internal crates.
kirei-core = { path = "crates/kirei-core" }
kirei-archive = { path = "crates/kirei-archive" }
kirei-reader = { path = "crates/kirei-reader" }
kirei-library = { path = "crates/kirei-library" }
kirei-mangadex = { path = "crates/kirei-mangadex" }
kirei-download = { path = "crates/kirei-download" }
kirei-anilist = { path = "crates/kirei-anilist" }

# External. Versions live here, never in a leaf crate, so the tree stays unified.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Desktop shell. Reached from apps/desktop/src-tauri only.
tauri = { version = "2.12", features = [] }
tauri-build = { version = "2.7", features = [] }
tauri-plugin-dialog = "2.8"
# Saves the window size, position and maximized state on close, restores on launch.
tauri-plugin-window-state = "2.5"
# Self-update from the signed latest.json feed on GitHub releases. Release
# builds only; see docs/release.md.
tauri-plugin-updater = "2.10"
# Compares the versions the two update feeds announce.
semver = "1"

# Archive backends (kirei-archive). Reading only: `deflate-flate2-zlib-rs` is
# the one decoder CBZ files use in practice, and it skips the zopfli encoder
# the plain `deflate` feature pulls in. Locked to 9.1.3 in Cargo.lock because
# the 9.x line shipped twelve releases in two weeks; move up once one has aged.
zip = { version = "9.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# RAR (CBR) reading. Wraps RARLAB's UnRAR C++ source, the reference decoder:
# every RAR version, solid archives, and the same code WinRAR extracts with.
# The Rust crate is MIT OR Apache-2.0; the vendored UnRAR source is under the
# UnRAR licence (free to use in any software that handles RAR archives, may not
# be used to build a RAR compressor). Builds with the platform C++ toolchain.
unrar = "0.5.8"
# Pixel size from image headers, without decoding.
imagesize = "0.15"
# The page cache's recency order (kirei-reader). MIT.
lru = "0.19"

# Library database and scanner (kirei-library).
# SQLite through rusqlite with the bundled amalgamation, so Windows and macOS
# ship the same SQLite with no system library to find. MIT.
rusqlite = { version = "0.41", features = ["bundled"] }
# Loose chapter and volume names. MIT OR Apache-2.0.
regex = "1.13"
# ComicInfo.xml. MIT.
quick-xml = "0.42"
# Cover decode, downscale and JPEG thumbnails. Only the formats manga covers
# come in; no rayon, no AVIF (that needs a native dav1d). MIT OR Apache-2.0.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
# JPEG encoder for the reader's re-encoded pages: about 2.5x faster than `image`'s
# own encoder at the same quality. (MIT OR Apache-2.0) AND IJG.
jpeg-encoder = { version = "0.7", default-features = false, features = ["std"] }
# Content hash that keys the cover cache. CC0-1.0 OR Apache-2.0.
blake3 = "1.8"
# Parallel archive reads and cover generation during a scan. MIT OR Apache-2.0.
rayon = "1.12"
# SIMD resampling for the viewport-sized downscale (kirei-reader). MIT OR
# Apache-2.0. Several times faster than `image`'s own resize on the same filter,
# and it carries every filter the reader's quality settings offer.
fast_image_resize = "6.1"
# Watches library roots for new or changed chapters (kirei-library). CC0-1.0.
# FSEvents on macOS, ReadDirectoryChangesW on Windows. Debouncing is done in
# the library's own watcher thread, so no debouncer crate.
notify = "8.2"

# MangaDex client (kirei-mangadex). The same reqwest the updater already
# builds, with the same TLS setup: rustls with the ring provider and the OS
# certificate store, no aws-lc (which needs cmake and NASM on Windows). No
# reqwest `json`, `query` or `form`: bodies are built with serde_json and url.
# reqwest is MIT OR Apache-2.0, rustls Apache-2.0 OR ISC OR MIT.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Async runtime pieces only: sleeping for the rate limiter and async locks.
# Tauri runs on tokio already. MIT.
tokio = { version = "1", default-features = false, features = ["sync", "time"] }
# Query strings and form bodies. MIT OR Apache-2.0.
url = "2.5"
# Response bodies, shared without copying between the cache and callers. MIT.
bytes = "1"

# AniList tracking (kirei-anilist) and the desktop keychain.
# OS randomness for the sign in nonce. Already in the tree through rustls and
# tempfile. MIT OR Apache-2.0.
getrandom = "0.3"
# The OS credential store: Keychain on macOS, Credential Manager on Windows.
# Only the two native backends; no Linux secret service, which would pull in
# D-Bus. MIT OR Apache-2.0.
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native"] }

# Test-only helpers.
# Local HTTP server that replays recorded MangaDex responses. MIT OR Apache-2.0.
wiremock = "0.6"
tempfile = "3"
crc32fast = "1.5"
# Writes RAR fixtures inside the tests, since no RAR encoder ships with the
# OS or CI runners. Pure Rust, Apache-2.0, dev-dependency only.
rars = "=0.12.3"

# Lints are declared once and inherited by every member via `[lints] workspace
# = true`. CI runs clippy with `-D warnings`, so a warn here is a hard gate.
[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
await_holding_lock = "warn"
# `.unwrap()` in a desktop app is a user-visible crash; propagate instead.
unwrap_used = "warn"
todo = "warn"
dbg_macro = "warn"

[profile.dev]
incremental = true
# File and line in backtraces, no debugger locals: much smaller target dirs and faster links.
debug = "line-tables-only"

# Dependencies (image decoding, resampling, JPEG encoding, archive inflate)
# build optimised in dev too: unoptimised they made a large page take about
# 3 s to serve in `pnpm tauri dev`. They rarely change, so the cost is paid on
# a clean build only. `"*"` matches no workspace member, so the other
# workspace crates stay at opt-level 0 for fast incremental rebuilds.
[profile.dev.package."*"]
opt-level = 3

# The page pipeline calls generic decode, resize and encode code, which is
# compiled into the crate that calls it, at that crate's opt-level. Optimising
# the dependencies alone left a page at about 1.3 s; this brings it near the
# release build.
[profile.dev.package.kirei-reader]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
strip = true
