packages:
  - 'apps/*'

# The owner's global npm config sets a 7 day minimum release age. Mirroring it
# here makes the gate a property of the repo instead of one machine, and the
# pinned pnpm (10.16 or newer) enforces it during resolution. Minutes.
minimumReleaseAge: 10080

onlyBuiltDependencies:
  - esbuild
