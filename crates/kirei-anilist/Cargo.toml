[package]
name = "kirei-anilist"
description = "AniList tracking for KireiManga: sign in through the browser, a rate limited GraphQL client and the progress sync rules"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
getrandom = { workspace = true }
reqwest = { workspace = true }
# reqwest is built with `rustls-no-provider`; the client installs ring as the
# process default crypto provider, as the MangaDex client does.
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `net` and `io-util` for the loopback listener that catches the sign in
# redirect, `macros` for its timeout select.
tokio = { workspace = true, features = ["net", "io-util", "macros"] }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
wiremock = { workspace = true }

[lints]
workspace = true
