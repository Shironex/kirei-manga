[package]
name = "kirei-library"
description = "Local library for KireiManga: SQLite catalogue, folder scanner, cover cache and palettes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
blake3 = { workspace = true }
image = { workspace = true }
kirei-archive = { workspace = true }
kirei-core = { workspace = true }
quick-xml = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Backup files. Writing needs the deflate encoder, which the flate2 backend
# already brings for reading.
zip = { workspace = true, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
