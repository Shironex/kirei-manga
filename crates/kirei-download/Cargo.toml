[package]
name = "kirei-download"
description = "Offline downloads for KireiManga: a resumable MangaDex queue that writes CBZ archives with ComicInfo.xml"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
kirei-mangadex = { workspace = true }
# Escaping for ComicInfo.xml.
quick-xml = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
# `rt` for the dispatcher and page tasks; the desktop shell runs tokio already.
tokio = { workspace = true, features = ["rt"] }
# CBZ writing. Pages are stored as they come (JPEG and PNG do not deflate);
# ComicInfo.xml is deflated with the encoder the flate2 backend brings.
zip = { workspace = true }

[dev-dependencies]
bytes = { workspace = true }
image = { workspace = true }
kirei-library = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
wiremock = { workspace = true }

[lints]
workspace = true
